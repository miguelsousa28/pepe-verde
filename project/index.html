<!-- Fonts: Bowlby One (blocky display, similar to PEPE VERDE lettering),
     Inter (UI), JetBrains Mono (placeholder labels) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F7F4E8; color: #1F5A3F; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body { font-family: 'Inter', system-ui, sans-serif; }
  a { color: inherit; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }

  /* Better focus rings */
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid #C8463F;
    outline-offset: 2px;
  }

  /* Hover on green buttons */
  .pv-btn { transition: all 0.15s ease; }
  .pv-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .pv-btn:active { transform: translateY(0); }

  /* Toast animation */
  @keyframes pvSlide {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  /* Modal animations */
  @keyframes pvFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pvScale {
    from { opacity: 0; transform: translateY(12px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* Date strip scroll */
  .pv-date-strip::-webkit-scrollbar { height: 6px; }
  .pv-date-strip::-webkit-scrollbar-thumb { background: rgba(31,90,63,0.3); }

  /* Tabs scroll on mobile */
  .pv-cat-tabs::-webkit-scrollbar { height: 0; }
  .pv-cat-tabs { scrollbar-width: none; }

  /* ----- Responsive ----- */
  @media (max-width: 880px) {
    .pv-nav-desk { display: none !important; }
    .pv-menu-toggle { display: block !important; }
    .pv-uber-desk, .pv-reserve-desk { display: none !important; }
    .pv-hero-split-grid { grid-template-columns: 1fr !important; }
    .pv-loc-grid { grid-template-columns: 1fr !important; }
    .pv-form-2col, .pv-form-3col { grid-template-columns: 1fr !important; }
    .pv-modal-2col { grid-template-columns: 1fr !important; }
    .pv-sobre-grid { grid-template-columns: 1fr !important; }
    .pv-admin-sidebar { width: 100% !important; padding: 16px 0 !important; }
    .pv-admin-shell { flex-direction: column !important; }
    .pv-admin-main { padding: 24px 20px !important; }
  }
  @media (min-width: 881px) {
    .pv-menu-toggle, .pv-nav-mobile-panel { display: none !important; }
  }

  /* Menu stickers — only visible when there's room in the side gutters */
  @media (max-width: 1180px) {
    .pv-menu-sticker { display: none !important; }
  }

  /* Print: hide chrome */
  @media print {
    header, footer, .pv-tweaks { display: none !important; }
  }
</style>
